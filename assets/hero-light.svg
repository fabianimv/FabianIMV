<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Fabián Muñoz Vásquez — Site Reliability Engineer">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="waveLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveFillLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0F172A" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClipLight">
      <rect x="1" y="1" width="898" height="238" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #0F172A; letter-spacing: -0.6px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #334155; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
    .motto { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #6D28D9; }
    .pill-text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; fill: #1E293B; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @keyframes trace {
      0% { stroke-dashoffset: 620; }
      100% { stroke-dashoffset: 0; }
    }
    .dot-pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
    .wave-anim { stroke-dasharray: 620; stroke-dashoffset: 0; animation: trace 3.2s ease-out 1; }
  </style>

  <g clip-path="url(#cardClipLight)">
    <rect width="900" height="240" fill="url(#bgLight)"/>
    <rect width="900" height="240" fill="url(#gridLight)"/>

    <!-- Telemetry waveform -->
    <path d="M 460 198 L 535 198 L 555 182 L 570 206 L 588 158 L 606 212 L 622 186 L 642 194 L 690 194 L 712 172 L 730 202 L 748 144 L 766 208 L 784 180 L 806 192 L 864 192 L 864 240 L 460 240 Z" fill="url(#waveFillLight)"/>
    <path class="wave-anim" d="M 460 198 L 535 198 L 555 182 L 570 206 L 588 158 L 606 212 L 622 186 L 642 194 L 690 194 L 712 172 L 730 202 L 748 144 L 766 208 L 784 180 L 806 192 L 864 192" fill="none" stroke="url(#waveLight)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="864" cy="192" r="4" fill="#059669" class="dot-pulse"/>
    <circle cx="864" cy="192" r="9" fill="#059669" fill-opacity="0.18" class="dot-pulse"/>

    <!-- Top status bar -->
    <rect x="36" y="26" width="276" height="26" rx="13" fill="#10B981" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="52" cy="39" r="4" fill="#059669" class="dot-pulse"/>
    <text x="64" y="43" class="mono" fill="#047857">ALL SYSTEMS OPERATIONAL · 99.95%</text>

    <rect x="652" y="26" width="212" height="26" rx="13" fill="#0F172A" fill-opacity="0.04" stroke="#0F172A" stroke-opacity="0.1" stroke-width="1"/>
    <text x="668" y="43" class="mono" fill="#475569">ns: santiago-cl · 4+ yrs SRE</text>

    <!-- Main typography -->
    <text x="36" y="106" class="title">Fabián Muñoz Vásquez</text>
    <text x="36" y="135" class="subtitle">Site Reliability Engineer  ·  Kubernetes  ·  GitOps  ·  Observability  ·  AI Ops</text>
    <text x="36" y="162" class="motto">// "I like to keep the lights on."</text>

    <!-- Bottom metadata pills -->
    <rect x="36" y="184" width="166" height="28" rx="8" fill="#0F172A" fill-opacity="0.05" stroke="#0F172A" stroke-opacity="0.1" stroke-width="1"/>
    <text x="50" y="202" class="pill-text">SRE @ Banco Falabella</text>

    <rect x="212" y="184" width="184" height="28" rx="8" fill="#7C3AED" fill-opacity="0.09" stroke="#7C3AED" stroke-opacity="0.25" stroke-width="1"/>
    <text x="226" y="202" class="pill-text">Open to remote &amp; travel</text>

    <rect x="406" y="184" width="142" height="28" rx="8" fill="#0284C7" fill-opacity="0.08" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1"/>
    <text x="420" y="202" class="pill-text">Python &amp; MCP OSS</text>

    <!-- Top accent line -->
    <rect x="0" y="0" width="900" height="3" fill="url(#accentLight)"/>
  </g>

  <rect x="1" y="1" width="898" height="238" rx="16" fill="none" stroke="#0F172A" stroke-opacity="0.1" stroke-width="1"/>
</svg>
